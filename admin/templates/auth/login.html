{% extends "base.html" %}

{% block title %}Вход — СМЕНА{% endblock %}

{% block auth_content %}
<div class="auth-card">
    <div class="d-flex align-items-center gap-3 mb-4">
        <span class="brand-mark">С</span>
        <div>
            <h4 class="mb-0 fw-bold">СМЕНА</h4>
            <small class="text-body-secondary">Вход в админ-панель</small>
        </div>
    </div>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-floating mb-3">
            <input type="text" class="form-control" id="username" name="username" placeholder="admin" required autofocus>
            <label for="username">Имя пользователя</label>
        </div>
        <div class="form-floating mb-4">
            <input type="password" class="form-control" id="password" name="password" placeholder="пароль" required>
            <label for="password">Пароль</label>
        </div>
        <button type="submit" class="btn btn-brand w-100 py-2">Войти</button>
    </form>
</div>
{% endblock %}
